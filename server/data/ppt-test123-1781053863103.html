<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026年AI趋势报告</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif;background:#0f172a;}
  .slides{width:100%;height:100%;position:relative;}

  .slide{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;overflow:hidden;}
  .slide.active{display:flex;}

  /* ── Cover ── */
  .slide-cover{background:linear-gradient(135deg, #020617 0%, #0f172a 30%, #1e293b 60%, #0f172a 100%);color:#e2e8f0;align-items:center;justify-content:center;text-align:center;padding:80px;}
  .slide-cover .cover-title{font-size:clamp(32px,4.5vw,64px);font-weight:700;letter-spacing:2px;margin-bottom:16px;line-height:1.3;}
  .slide-cover .cover-subtitle{font-size:clamp(16px,2vw,28px);opacity:0.85;font-weight:300;max-width:80%;}
  .slide-cover .cover-line{width:80px;height:3px;border-radius:2px;background:#e2e8f0;opacity:0.4;margin:24px auto;}
  .slide-cover .cover-decoration{position:absolute;top:-80px;right:-80px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,0.04);pointer-events:none;}
  .slide-cover .cover-decoration2{position:absolute;bottom:-60px;left:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,0.03);pointer-events:none;}

  /* ── Content ── */
  .slide-content{background:#1e293b;padding:0;}
  .content-header{background:#06b6d4;padding:18px 60px;}
  .content-header h2{color:#fff;font-size:clamp(18px,2.2vw,32px);font-weight:600;letter-spacing:0.5px;}
  .content-body{flex:1;padding:40px 60px 50px;display:flex;flex-direction:column;justify-content:center;}
  .content-body ul{list-style:none;width:100%;}
  .content-body li{font-size:clamp(14px,1.5vw,22px);padding:10px 0;line-height:1.7;color:#e2e8f0;display:flex;align-items:flex-start;gap:14px;border-bottom:1px solid #334155;}
  .content-body li:last-child{border-bottom:none;}
  .content-body li .dot{width:10px;height:10px;border-radius:50%;background:#06b6d4;flex-shrink:0;margin-top:8px;}
  .two-col-body{flex:1;padding:30px 60px 50px;display:flex;gap:40px;}
  .two-col-body .col{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .two-col-body .col ul{list-style:none;}
  .two-col-body .col li{font-size:clamp(13px,1.3vw,20px);padding:8px 0;line-height:1.6;color:#e2e8f0;display:flex;gap:12px;align-items:flex-start;}
  .two-col-body .col li .dot{width:8px;height:8px;border-radius:50%;background:#06b6d4;flex-shrink:0;margin-top:7px;}

  /* ── Section ── */
  .slide-section{background:linear-gradient(135deg, #0f172a 0%, #1e293b 100%);color:#06b6d4;align-items:center;justify-content:center;text-align:center;padding:60px;}
  .slide-section h2{font-size:clamp(24px,3vw,44px);font-weight:600;}
  .slide-section .section-line{margin:16px auto;width:60px;height:2px;border-radius:1px;background:#06b6d4;}

  /* ── Ending ── */
  .slide-ending{background:#020617;color:#e2e8f0;align-items:center;justify-content:center;text-align:center;padding:60px;}
  .slide-ending h2{font-size:clamp(28px,3.5vw,52px);font-weight:600;margin-bottom:16px;}
  .slide-ending p{font-size:clamp(14px,1.4vw,22px);opacity:0.6;}

  /* ── Navigation ── */
  .nav-bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:16px;}
  .nav-btn{width:44px;height:44px;border-radius:50%;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
  .nav-btn:hover{background:#06b6d4;color:#fff;border-color:#06b6d4;}
  .nav-btn:disabled{opacity:0.3;cursor:default;}
  .nav-btn:disabled:hover{background:#1e293b;color:#e2e8f0;border-color:#334155;}
  .page-indicator{font-size:13px;color:#94a3b8;min-width:60px;text-align:center;font-variant-numeric:tabular-nums;}
  .slide-number{position:fixed;bottom:32px;right:36px;font-size:12px;color:#94a3b8;opacity:0.6;z-index:100;font-variant-numeric:tabular-nums;letter-spacing:1px;}
</style>
</head>
<body>
<div class="slides">
<div class="slide slide-cover active">
        <div class="cover-decoration"></div>
        <div class="cover-decoration2"></div>
        <div class="cover-title">2026年AI趋势报告</div>
        <div class="cover-subtitle">人工智能的下一个十年</div>
        <div class="cover-line"></div>
      </div>
<div class="slide slide-content">
        <div class="content-header"><h2>AI 市场规模</h2></div>
        <div class="content-body">
          <ul><li><span class="dot"></span>全球AI市场预计2026年突破3000亿美元</li><li><span class="dot"></span>年复合增长率超过36%</li><li><span class="dot"></span>中国AI市场占比将达到25%</li><li><span class="dot"></span>大模型训练成本每年下降40%</li></ul>
        </div>
      </div>
<div class="slide slide-section">
        <h2>关键技术突破</h2>
        <div class="section-line"></div>
      </div>
<div class="slide slide-content">
        <div class="content-header"><h2>多模态 vs 单一模态</h2></div>
        <div class="two-col-body">
          <div class="col"><ul><li><span class="dot"></span>多模态模型成为主流</li><li><span class="dot"></span>视觉理解能力大幅提升</li><li><span class="dot"></span>语音交互更加自然</li><li><span class="dot"></span>单一模型处理多种任务</li></ul></div>
          <div style="width:1px;background:#334155;flex-shrink:0;"></div>
          <div class="col"><ul><li><span class="dot"></span>传统单模态仍有优势</li><li><span class="dot"></span>特定场景效率更高</li><li><span class="dot"></span>部署成本更低</li></ul></div>
        </div>
      </div>
<div class="slide slide-ending">
        <h2>谢谢观看</h2>
        <p>让我们一起拥抱AI时代</p>
      </div>
</div>
<div class="nav-bar">
  <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">◀</button>
  <span class="page-indicator" id="pageIndicator">1 / 5</span>
  <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">▶</button>
</div>
<div class="slide-number" id="slideNumber">01 / 05</div>
<script>
(function(){var slides=document.querySelectorAll('.slide');var current=0;function show(n){slides.forEach(function(s,i){s.classList.toggle('active',i===n);});document.getElementById('pageIndicator').textContent=(n+1)+' / '+slides.length;document.getElementById('slideNumber').textContent=String(n+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');document.getElementById('prevBtn').disabled=n===0;document.getElementById('nextBtn').disabled=n===slides.length-1;}
window.changeSlide=function(d){var next=current+d;if(next>=0&&next<slides.length){current=next;show(current);}};document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ')changeSlide(1);if(e.key==='ArrowLeft'||e.key==='ArrowUp')changeSlide(-1);});show(0);})();
</script>
</body>
</html>
